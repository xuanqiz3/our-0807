<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>♥</title>
<style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff1ed,#f6d9d6);font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#3a2a2a;padding:20px}
.b{background:#fff;border-radius:26px;padding:34px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(224,112,127,.28)}
.h{font-size:54px;color:#e0707f;line-height:1}h1{font-size:20px;margin:12px 0 6px}p{font-size:13px;color:#8a6f6f;margin-bottom:18px}

<div class="b"><div class="h">♥</div><h1>只给你看的小站</h1><p>输入暗号进入</p>
<input id="pw" type="password" autocomplete="off" placeholder="••••" onkeydown="if(event.key==='Enter')go()"><button onclick="go()" id="bt">进入</button><div id="e"></div></div>
<script>
const IT=300000;
let buf=null;const pf=fetch('site.enc').then(r=>r.arrayBuffer()).then(b=>buf=b).catch(()=>null);
async function dec(pw,buf){const u=new Uint8Array(buf),salt=u.slice(0,16),iv=u.slice(16,28),ct=u.subarray(28);
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct))}
async function open_(pw,silent){const e=document.getElementById('e'),bt=document.getElementById('bt');
 try{bt.disabled=true;bt.textContent='解锁中…';e.textContent='';if(!buf)await pf;if(!buf)buf=await (await fetch('site.enc')).arrayBuffer();
  const u=await dec(pw,buf),dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let o=0;
  const hl=dv.getUint32(o);o+=4;let h=new TextDecoder().decode(u.subarray(o,o+hl));o+=hl;
  const cnt=dv.getUint32(o);o+=4;const P={};
  for(let i=0;i<cnt;i++){const nl=dv.getUint8(o);o+=1;const n=new TextDecoder().decode(u.subarray(o,o+nl));o+=nl;const sz=dv.getUint32(o);o+=4;
   const url=URL.createObjectURL(new Blob([u.subarray(o,o+sz)],{type:'image/jpeg'}));o+=sz;P[n.replace('.jpg','')]=url;h=h.split('photos/'+n).join(url)}
  h=h.split('photos/${id}.jpg').join('${window.__P[id]}');window.__P=P;
  document.open();document.write(h);document.close()}
 catch(x){bt.disabled=false;bt.textContent='进入';if(!silent)e.textContent='暗号不对，再试试'}}
function go(){open_(document.getElementById('pw').value,false)}
try{localStorage.removeItem('k')}catch(_){}
</script></body></html>
